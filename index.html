<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>WB · Length Converter</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #FAFAF8;
    color: #1A1714;
    font-family: 'DM Sans', 'Segoe UI', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body {
    position: relative;
    padding: 28px 20px 120px;
    max-width: 560px;
    margin: 0 auto;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, #1B7C8A 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.06;
    pointer-events: none;
    z-index: 0;
  }
  .wrap { position: relative; z-index: 1; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #6B6158;
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: clamp(26px, 6vw, 34px);
    line-height: 1.15;
    background: linear-gradient(135deg, #1A5C35, #1B7C8A, #1450A3);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }
  .subtitle {
    color: #4A453F;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 8px;
    margin-bottom: 24px;
  }

  .card {
    background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.07);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .card.active {
    border-color: rgba(27, 124, 138, 0.45);
    background: linear-gradient(135deg, rgba(61, 214, 160, 0.06), rgba(27, 124, 138, 0.06));
    box-shadow: 0 2px 12px rgba(27, 124, 138, 0.10);
  }
  .label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6B6158;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .src-badge {
    font-size: 9px;
    letter-spacing: 1.5px;
    color: #1B6B4A;
    background: rgba(61, 214, 160, 0.18);
    border-radius: 3px;
    padding: 2px 7px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .card.active .src-badge { opacity: 1; }

  .row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .field-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field-mini {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #8A8078;
  }
  input[type="number"] {
    width: 100%;
    background: #FAFAF8;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 6px;
    padding: 12px 14px;
    color: #1A1714;
    font-family: 'DM Sans', sans-serif;
    font-size: 17px;
    font-weight: 500;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"]:focus {
    border-color: rgba(27, 124, 138, 0.55);
    background: #FFFFFF;
  }

  .footnote {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8A8078;
    text-align: center;
    margin-top: 18px;
  }

  /* Bottom action bar */
  .actions {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(250, 250, 248, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(0,0,0,0.06);
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .actions-inner {
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 14px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn-ok {
    background: linear-gradient(135deg, #1A5C35, #2E9E6B, #1B7C8A);
    color: #FFFFFF;
    flex: 2;
    box-shadow: 0 4px 14px rgba(27, 124, 138, 0.25);
  }
  .btn-clear {
    background: #FFFFFF;
    color: #4A453F;
    border: 1px solid rgba(0,0,0,0.10);
    flex: 1;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">WallBliss · Internal Tool</div>
  <h1>Length Converter</h1>
  <p class="subtitle">Type a value in any field, then tap <strong>OK</strong> below. Works offline.</p>

  <div class="card" id="card-mm">
    <div class="label"><span>Millimetres (mm)</span><span class="src-badge">Source</span></div>
    <div class="row">
      <input type="number" id="in-mm" inputmode="decimal" step="any" placeholder="0" data-src="mm" />
    </div>
  </div>

  <div class="card" id="card-cm">
    <div class="label"><span>Centimetres (cm)</span><span class="src-badge">Source</span></div>
    <div class="row">
      <input type="number" id="in-cm" inputmode="decimal" step="any" placeholder="0" data-src="cm" />
    </div>
  </div>

  <div class="card" id="card-inch">
    <div class="label"><span>Inches (in)</span><span class="src-badge">Source</span></div>
    <div class="row">
      <input type="number" id="in-inch" inputmode="decimal" step="any" placeholder="0" data-src="inch" />
    </div>
  </div>

  <div class="card" id="card-ft">
    <div class="label"><span>Feet &amp; Inches (ft / in)</span><span class="src-badge">Source</span></div>
    <div class="row">
      <div class="field-group">
        <span class="field-mini">Feet</span>
        <input type="number" id="in-ft" inputmode="decimal" step="any" placeholder="0" data-src="ft" />
      </div>
      <div class="field-group">
        <span class="field-mini">Inches</span>
        <input type="number" id="in-ftin" inputmode="decimal" step="any" placeholder="0" data-src="ft" />
      </div>
    </div>
  </div>

  <div class="footnote">1 in = 25.4 mm · 1 ft = 304.8 mm · rounded to 1 decimal</div>

</div>

<div class="actions">
  <div class="actions-inner">
    <button class="btn btn-clear" id="clear-btn">Clear</button>
    <button class="btn btn-ok" id="ok-btn">OK · Convert</button>
  </div>
</div>

<script>
  const MM_PER_INCH = 25.4;
  const MM_PER_FOOT = 304.8;

  const el = {
    mm:   document.getElementById('in-mm'),
    cm:   document.getElementById('in-cm'),
    inch: document.getElementById('in-inch'),
    ft:   document.getElementById('in-ft'),
    ftin: document.getElementById('in-ftin'),
  };
  const cards = {
    mm:   document.getElementById('card-mm'),
    cm:   document.getElementById('card-cm'),
    inch: document.getElementById('card-inch'),
    ft:   document.getElementById('card-ft'),
  };

  let activeSrc = null;

  function parseNum(v) {
    if (v === '' || v === null || v === undefined) return 0;
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  // Round to 1 decimal; show integers without trailing .0
  function fmt(n) {
    if (!isFinite(n)) return '';
    const r = Math.round(n * 10) / 10;
    return Number.isInteger(r) ? r.toString() : r.toFixed(1);
  }

  function setActive(src) {
    activeSrc = src;
    Object.entries(cards).forEach(([k, c]) => {
      c.classList.toggle('active', k === src);
    });
  }

  function convert() {
    if (!activeSrc) {
      if (el.mm.value)   activeSrc = 'mm';
      else if (el.cm.value)   activeSrc = 'cm';
      else if (el.inch.value) activeSrc = 'inch';
      else if (el.ft.value || el.ftin.value) activeSrc = 'ft';
      else return;
    }

    let mm = 0;
    switch (activeSrc) {
      case 'mm':   mm = parseNum(el.mm.value); break;
      case 'cm':   mm = parseNum(el.cm.value) * 10; break;
      case 'inch': mm = parseNum(el.inch.value) * MM_PER_INCH; break;
      case 'ft':
        mm = parseNum(el.ft.value) * MM_PER_FOOT
           + parseNum(el.ftin.value) * MM_PER_INCH;
        break;
    }

    el.mm.value   = fmt(mm);
    el.cm.value   = fmt(mm / 10);
    el.inch.value = fmt(mm / MM_PER_INCH);

    const totalInches = mm / MM_PER_INCH;
    const wholeFeet = Math.floor(totalInches / 12);
    const remInches = totalInches - wholeFeet * 12;
    el.ft.value = wholeFeet.toString();
    el.ftin.value = fmt(remInches);

    setActive(activeSrc);
  }

  Object.values(el).forEach(input => {
    input.addEventListener('focus', () => setActive(input.dataset.src));
    input.addEventListener('input', () => setActive(input.dataset.src));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        input.blur();
        convert();
      }
    });
  });

  document.getElementById('ok-btn').addEventListener('click', convert);

  document.getElementById('clear-btn').addEventListener('click', () => {
    Object.values(el).forEach(i => i.value = '');
    Object.values(cards).forEach(c => c.classList.remove('active'));
    activeSrc = null;
    el.mm.focus();
  });
</script>
</body>
</html>
