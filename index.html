<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>WB · Length Converter</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root { --kb: 0px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #FAFAF8;
    color: #1A1714;
    font-family: 'DM Sans', 'Segoe UI', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body {
    position: relative;
    padding: 28px 20px calc(130px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, #1B7C8A 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.06;
    pointer-events: none;
    z-index: 0;
  }
  .wrap { position: relative; z-index: 1; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #6B6158;
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: clamp(26px, 6vw, 34px);
    line-height: 1.15;
    background: linear-gradient(135deg, #1A5C35, #1B7C8A, #1450A3);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }
  .subtitle {
    color: #4A453F;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 8px;
    margin-bottom: 24px;
  }

  .card {
    background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.07);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .card.active {
    border-color: rgba(27, 124, 138, 0.45);
    background: linear-gradient(135deg, rgba(61, 214, 160, 0.06), rgba(27, 124, 138, 0.06));
    box-shadow: 0 2px 12px rgba(27, 124, 138, 0.10);
  }
  /* Other fields fade while a new value is being typed, until Convert */
  .card.stale input { color: #B5ADA5; }
  .label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6B6158;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .src-badge {
    font-size: 9px;
    letter-spacing: 1.5px;
    color: #1B6B4A;
    background: rgba(61, 214, 160, 0.18);
    border-radius: 3px;
    padding: 2px 7px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .card.active .src-badge { opacity: 1; }

  .row { display: flex; gap: 8px; align-items: stretch; }
  .field-group { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field-mini {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #8A8078;
  }
  .input-wrap { position: relative; flex: 1; min-width: 0; }
  input[type="text"] {
    width: 100%;
    background: #FAFAF8;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 6px;
    padding: 12px 44px 12px 14px;
    color: #1A1714;
    font-family: 'DM Sans', sans-serif;
    font-size: 17px;
    font-weight: 500;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  input[type="text"]::-webkit-outer-spin-button,
  input[type="text"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="text"]:focus { border-color: rgba(27, 124, 138, 0.55); background: #FFFFFF; }

  /* Per-field clear (×) — only visible when the field has a value */
  .x {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%) scale(0.8);
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #8A8078;
    font-size: 18px;
    line-height: 32px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .x::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: rgba(0,0,0,0.07);
    z-index: -1;
  }
  .input-wrap.has-val .x { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }

  .footnote {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8A8078;
    text-align: center;
    margin-top: 18px;
  }

  /* Floating dock */
  .dock-fade {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: calc(120px + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, rgba(250,250,248,0), rgba(250,250,248,0.95) 55%);
    pointer-events: none;
    z-index: 9;
  }
  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom) + var(--kb));
    transform: translateX(-50%);
    width: min(520px, calc(100% - 32px));
    display: flex;
    gap: 10px;
    z-index: 20;
    transition: bottom 0.18s ease;
  }
  .btn {
    border: none;
    border-radius: 999px;
    height: 54px;
    padding: 0 22px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.1s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { cursor: default; transform: none; }
  .btn-clear:disabled { color: #C2BAB2; box-shadow: 0 4px 12px rgba(26, 23, 20, 0.06); }
  .btn-ok:disabled { background: #B9D6CE; }
  .btn-clear {
    background: #FFFFFF;
    color: #4A453F;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 6px 18px rgba(26, 23, 20, 0.12);
  }
  .btn-clear svg { width: 16px; height: 16px; }
  .btn-ok {
    flex: 1;
    background: linear-gradient(135deg, #1A5C35, #2E9E6B, #1B7C8A);
    color: #FFFFFF;
    box-shadow: 0 8px 22px rgba(27, 124, 138, 0.35);
  }
  .btn-ok:disabled { box-shadow: 0 6px 16px rgba(27, 124, 138, 0.15); }
  .btn-ok.ready { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge {
    0%, 100% { box-shadow: 0 8px 22px rgba(27, 124, 138, 0.35); }
    50%      { box-shadow: 0 8px 30px rgba(46, 158, 107, 0.60); }
  }

  /* Undo toast — sits just above the dock */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(84px + env(safe-area-inset-bottom) + var(--kb));
    transform: translate(-50%, 10px);
    background: #1A1714;
    color: #FAFAF8;
    border-radius: 999px;
    padding: 6px 6px 6px 18px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.20);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease, bottom 0.18s ease;
    z-index: 30;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button {
    border: none;
    background: rgba(61, 214, 160, 0.18);
    color: #3DD6A0;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 9px 14px;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">WallBliss · Internal Tool</div>
  <h1>Length Converter</h1>
  <p class="subtitle">Type a value in any field, then tap <strong>Convert</strong>. Works offline.</p>

  <div class="card" id="card-mm">
    <div class="label"><span>Millimetres (mm)</span><span class="src-badge">Source</span></div>
    <div class="row">
      <div class="input-wrap"><input class="num" type="text" id="in-mm" inputmode="decimal" autocomplete="off" placeholder="0" data-src="mm" /><button class="x" type="button" aria-label="Clear millimetres">×</button></div>
    </div>
  </div>

  <div class="card" id="card-cm">
    <div class="label"><span>Centimetres (cm)</span><span class="src-badge">Source</span></div>
    <div class="row">
      <div class="input-wrap"><input class="num" type="text" id="in-cm" inputmode="decimal" autocomplete="off" placeholder="0" data-src="cm" /><button class="x" type="button" aria-label="Clear centimetres">×</button></div>
    </div>
  </div>

  <div class="card" id="card-inch">
    <div class="label"><span>Inches (in)</span><span class="src-badge">Source</span></div>
    <div class="row">
      <div class="input-wrap"><input class="num" type="text" id="in-inch" inputmode="decimal" autocomplete="off" placeholder="0" data-src="inch" /><button class="x" type="button" aria-label="Clear inches">×</button></div>
    </div>
  </div>

  <div class="card" id="card-ft">
    <div class="label"><span>Feet &amp; Inches (ft / in)</span><span class="src-badge">Source</span></div>
    <div class="row">
      <div class="field-group">
        <span class="field-mini">Feet</span>
        <div class="input-wrap"><input class="num" type="text" id="in-ft" inputmode="decimal" autocomplete="off" placeholder="0" data-src="ft" /><button class="x" type="button" aria-label="Clear feet">×</button></div>
      </div>
      <div class="field-group">
        <span class="field-mini">Inches</span>
        <div class="input-wrap"><input class="num" type="text" id="in-ftin" inputmode="decimal" autocomplete="off" placeholder="0" data-src="ft" /><button class="x" type="button" aria-label="Clear inches part">×</button></div>
      </div>
    </div>
  </div>

  <div class="footnote">1 in = 25.4 mm · 1 ft = 304.8 mm · rounded to 1 decimal</div>

</div>

<div class="dock-fade"></div>
<div class="dock">
  <button class="btn btn-clear" id="clear-btn" type="button" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    Clear
  </button>
  <button class="btn btn-ok" id="ok-btn" type="button" disabled>Convert</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span>All fields cleared</span>
  <button type="button" id="undo-btn">Undo</button>
</div>

<script>
  const MM_PER_INCH = 25.4;
  const MM_PER_FOOT = 304.8;
  const UNDO_MS = 4000;

  const el = {
    mm:   document.getElementById('in-mm'),
    cm:   document.getElementById('in-cm'),
    inch: document.getElementById('in-inch'),
    ft:   document.getElementById('in-ft'),
    ftin: document.getElementById('in-ftin'),
  };
  const cards = {
    mm:   document.getElementById('card-mm'),
    cm:   document.getElementById('card-cm'),
    inch: document.getElementById('card-inch'),
    ft:   document.getElementById('card-ft'),
  };
  const okBtn = document.getElementById('ok-btn');
  const clearBtn = document.getElementById('clear-btn');
  const toast = document.getElementById('toast');

  let activeSrc = null;
  let dirty = false;      // source edited since last convert
  let undoSnap = null;
  let toastTimer = null;

  const inputs = Object.values(el);

  function parseNum(v) {
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  // Round to 1 decimal; show integers without trailing .0
  function fmt(n) {
    if (!isFinite(n)) return '';
    const r = Math.round(n * 10) / 10;
    return Number.isInteger(r) ? r.toString() : r.toFixed(1);
  }

  function srcHasValue(src) {
    if (!src) return false;
    if (src === 'ft') return el.ft.value !== '' || el.ftin.value !== '';
    return el[src].value !== '';
  }

  function refresh() {
    inputs.forEach(i => i.parentElement.classList.toggle('has-val', i.value !== ''));
    const anyVal = inputs.some(i => i.value !== '');
    clearBtn.disabled = !anyVal;
    okBtn.disabled = !anyVal;
    okBtn.classList.toggle('ready', dirty && srcHasValue(activeSrc));
    Object.entries(cards).forEach(([k, c]) => {
      c.classList.toggle('active', k === activeSrc);
      c.classList.toggle('stale', dirty && k !== activeSrc && hasCardValue(k));
    });
  }

  function hasCardValue(k) {
    return k === 'ft' ? (el.ft.value !== '' || el.ftin.value !== '') : el[k].value !== '';
  }

  function convert() {
    if (!srcHasValue(activeSrc)) {
      activeSrc = ['mm', 'cm', 'inch', 'ft'].find(srcHasValue) || null;
      if (!activeSrc) return;
    }

    let mm = 0;
    switch (activeSrc) {
      case 'mm':   mm = parseNum(el.mm.value); break;
      case 'cm':   mm = parseNum(el.cm.value) * 10; break;
      case 'inch': mm = parseNum(el.inch.value) * MM_PER_INCH; break;
      case 'ft':   mm = parseNum(el.ft.value) * MM_PER_FOOT + parseNum(el.ftin.value) * MM_PER_INCH; break;
    }

    if (activeSrc !== 'mm')   el.mm.value   = fmt(mm);
    if (activeSrc !== 'cm')   el.cm.value   = fmt(mm / 10);
    if (activeSrc !== 'inch') el.inch.value = fmt(mm / MM_PER_INCH);
    if (activeSrc !== 'ft') {
      // Round total inches first so the inches part never shows 12
      const totalIn = Math.round((mm / MM_PER_INCH) * 10) / 10;
      const wholeFt = Math.floor(totalIn / 12);
      el.ft.value = wholeFt.toString();
      el.ftin.value = fmt(totalIn - wholeFt * 12);
    }

    dirty = false;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
    refresh();
  }

  function hideToast() {
    toast.classList.remove('show');
    clearTimeout(toastTimer);
    undoSnap = null;
  }

  function clearAll() {
    undoSnap = { vals: inputs.map(i => i.value), src: activeSrc, dirty };
    inputs.forEach(i => i.value = '');
    activeSrc = null;
    dirty = false;
    if (document.activeElement) document.activeElement.blur();
    refresh();
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, UNDO_MS);
  }

  function undoClear() {
    if (!undoSnap) return;
    inputs.forEach((i, idx) => i.value = undoSnap.vals[idx]);
    activeSrc = undoSnap.src;
    dirty = undoSnap.dirty;
    hideToast();
    refresh();
  }

  inputs.forEach(input => {
    // Tap a filled field → whole value selected, so typing replaces it
    let justFocused = false;
    input.addEventListener('focus', () => {
      activeSrc = input.dataset.src;
      justFocused = true;
      input.select();
      refresh();
    });
    // Stop the tap's mouseup from collapsing the selection
    input.addEventListener('mouseup', e => { if (justFocused) { e.preventDefault(); justFocused = false; } });
    input.addEventListener('touchend', () => { if (justFocused) { setTimeout(() => input.select(), 0); justFocused = false; } });
    input.addEventListener('input', () => {
      // Accept comma as decimal; drop anything that is not a digit or dot
      const clean = input.value.replace(',', '.').replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');
      if (clean !== input.value) input.value = clean;
      activeSrc = input.dataset.src;
      dirty = true;
      if (undoSnap) hideToast();
      refresh();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); convert(); }
    });
  });

  // Per-field ×: empties just that field and keeps the cursor there
  document.querySelectorAll('.x').forEach(btn => {
    btn.addEventListener('pointerdown', e => e.preventDefault()); // keep keyboard open
    btn.addEventListener('click', () => {
      const input = btn.previousElementSibling;
      input.value = '';
      activeSrc = input.dataset.src;
      dirty = true;
      input.focus();
      refresh();
    });
  });

  // Keep buttons usable while the keyboard is open (decimal pad has no Enter)
  okBtn.addEventListener('pointerdown', e => e.preventDefault());
  okBtn.addEventListener('click', convert);
  clearBtn.addEventListener('click', clearAll);
  document.getElementById('undo-btn').addEventListener('click', undoClear);

  // Lift the floating dock above the on-screen keyboard
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const place = () => {
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', kb + 'px');
    };
    vv.addEventListener('resize', place);
    vv.addEventListener('scroll', place);
    place();
  }

  refresh();
</script>
</body>
</html>
